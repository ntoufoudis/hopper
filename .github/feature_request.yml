name: Feature request
description: Suggest an idea or improvement for Hopper
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For larger changes, opening this issue first lets us agree
        on the approach before any code is written.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Hopper to do? An API sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Hopper is a headless import engine that delegates file parsing to maatwebsite/excel.
      options:
        - label: This is about orchestration (mapping, validation, transformation, resolution, staging, preview, commit, audit) rather than reimplementing file parsing.
          required: false
        - label: I'd be willing to help implement this.
          required: false
